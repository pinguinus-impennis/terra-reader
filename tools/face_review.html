<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>顔位置の確認</title>
<style>
:root{--bg:#14161a;--card:#1c2027;--ink:#ece8df;--ink2:#b9b4aa;--mute:#6f737b;--ok:#6cbad0;--det:#e3a44a;--est:#6cbad0;--man:#7ee081;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink2);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:5;background:rgba(20,22,26,.96);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;color:var(--ink)}
header .st{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute)}
header button,header select{font:inherit;color:var(--ink);background:#262b33;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
header button.primary{background:var(--det);color:#14161a;font-weight:700;border-color:var(--det)}
.help{color:var(--mute);font-size:12px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.card.done{outline:2px solid var(--ok)}
.card .cv{position:relative;width:100%;aspect-ratio:1;background:#0d0f13;cursor:crosshair;overflow:hidden}
.card canvas{width:100%;height:100%;display:block}
.card .meta{padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .nm{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .use{font-size:10.5px;color:var(--mute);white-space:nowrap}
.card .btns{display:flex;gap:4px;padding:0 8px 8px}
.card .btns button{flex:1;font:inherit;font-size:11px;color:var(--ink2);background:#262b33;border:1px solid var(--line);border-radius:6px;padding:5px 0;cursor:pointer}
.card .btns button.on{background:var(--ok);color:#14161a;font-weight:700}
.tag{position:absolute;left:6px;top:6px;font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.6)}
.tag.det{color:var(--det)}.tag.est{color:var(--est)}.tag.man{color:var(--man)}
.zoom{position:absolute;right:6px;top:6px;width:64px;height:64px;border-radius:6px;border:1px solid var(--line);background:#000;overflow:hidden;pointer-events:none}
.zoom canvas{width:100%;height:100%}
</style>
</head>
<body>
<header>
  <h1>顔位置の確認</h1>
  <span class="st" id="stat"></span>
  <select id="filter">
    <option value="all">すべて</option>
    <option value="est">推定のみ（顔が見つからなかった体）</option>
    <option value="det">検出のみ</option>
    <option value="undone">未確認のみ</option>
    <option value="man">手直し済みのみ</option>
  </select>
  <button id="more">次の 60 体を表示</button>
  <button class="primary" id="export">書き出し（faces_overrides.json）</button>
  <button id="clear">手直しを全部消す</button>
  <div class="help">
    出番の多い体から順に並んでいます。枠が顔に合っていれば何もしなくて OK（「OK」を押すと確認済みの印だけ付きます）。
    ずれていたら <b>画像の顔の中心をクリック</b>して枠を移動、<b>マウスホイール</b>で枠の大きさを変更。オレンジ＝自動検出、水色＝推定、緑＝手直し。右上の小窓は枠の中身の拡大。
    終わったら「書き出し」で JSON を保存し、<code>python tools/apply_overrides.py ダウンロードしたファイル</code> で反映します。手直しはブラウザにも保存されるので途中で閉じても残ります。
  </div>
</header>
<div class="grid" id="grid"></div>

<script>
const $ = s => document.querySelector(s);
const store = { get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }, set(k, v){ localStorage.setItem(k, JSON.stringify(v)); } };
let ITEMS = [], overrides = store.get('tr:faceOverrides', {}), done = store.get('tr:faceDone', {}), shown = 0;
const PAGE = 60;

fetch('../../_cache/review_index.json').then(r => r.json()).then(d => { ITEMS = d; render(true); });

function current(it){ return overrides[it.k] || it.f; }
function flagOf(it){ return overrides[it.k] ? 'man' : (it.f[5] === 0 ? 'det' : 'est'); }
function filtered(){
  const f = $('#filter').value;
  return ITEMS.filter(it => f === 'all' || (f === 'est' && it.f[5] === 1 && !overrides[it.k]) || (f === 'det' && it.f[5] === 0 && !overrides[it.k]) || (f === 'undone' && !done[it.k] && !overrides[it.k]) || (f === 'man' && overrides[it.k]));
}
function stat(){
  const n = ITEMS.length, m = Object.keys(overrides).length, d = Object.keys(done).length;
  $('#stat').textContent = `${n} 体 · 手直し ${m} · 確認済み ${d}`;
}
function render(reset){
  const list = filtered(); const grid = $('#grid');
  if(reset){ grid.innerHTML = ''; shown = 0; }
  const slice = list.slice(shown, shown + PAGE); shown += slice.length;
  for(const it of slice) grid.appendChild(card(it));
  $('#more').disabled = shown >= list.length; stat();
}
function card(it){
  const el = document.createElement('div'); el.className = 'card' + (done[it.k] ? ' done' : '');
  el.innerHTML = `<div class="cv"><canvas></canvas><span class="tag"></span><div class="zoom"><canvas></canvas></div></div>
    <div class="meta"><span class="nm" title="${it.k}">${it.name}</span><span class="use">${it.use} 回 / ${it.eps} 話</span></div>
    <div class="btns"><button data-a="ok">OK</button><button data-a="reset">自動に戻す</button><button data-a="est">推定にする</button></div>`;
  const cv = el.querySelector('canvas'), zc = el.querySelectorAll('canvas')[1];
  const img = new Image(); img.src = it.img;
  const draw = () => {
    const f = current(it), W = img.naturalWidth, H = img.naturalHeight; if(!W) return;
    cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.clearRect(0, 0, W, H); g.drawImage(img, 0, 0);
    const cx = f[0] * W, cy = f[1] * H, fh = f[2] * H;
    g.lineWidth = Math.max(2, W / 150); g.strokeStyle = { det: '#e3a44a', est: '#6cbad0', man: '#7ee081' }[flagOf(it)];
    g.strokeRect(cx - fh / 2, cy - fh / 2, fh, fh);
    g.beginPath(); g.moveTo(cx - fh * 0.15, cy); g.lineTo(cx + fh * 0.15, cy); g.moveTo(cx, cy - fh * 0.15); g.lineTo(cx, cy + fh * 0.15); g.stroke();
    el.querySelector('.tag').textContent = { det: '検出', est: '推定', man: '手直し' }[flagOf(it)]; el.querySelector('.tag').className = 'tag ' + flagOf(it);
    zc.width = 128; zc.height = 128; const zg = zc.getContext('2d'); zg.clearRect(0, 0, 128, 128);
    const s = fh * 1.6; zg.drawImage(img, cx - s / 2, cy - s / 2, s, s, 0, 0, 128, 128);
  };
  img.onload = draw;
  const cvWrap = el.querySelector('.cv');
  cvWrap.addEventListener('click', e => {
    const r = cv.getBoundingClientRect(); const f = current(it).slice();
    f[0] = +((e.clientX - r.left) / r.width).toFixed(4); f[1] = +((e.clientY - r.top) / r.height).toFixed(4); f[5] = 2;
    overrides[it.k] = f; store.set('tr:faceOverrides', overrides); draw(); stat();
  });
  cvWrap.addEventListener('wheel', e => {
    e.preventDefault(); const f = current(it).slice();
    f[2] = +Math.min(0.5, Math.max(0.02, f[2] * (e.deltaY < 0 ? 1.06 : 1 / 1.06))).toFixed(4); f[5] = 2;
    overrides[it.k] = f; store.set('tr:faceOverrides', overrides); draw(); stat();
  }, { passive: false });
  el.querySelector('.btns').addEventListener('click', e => {
    const a = e.target.dataset.a; if(!a) return;
    if(a === 'ok'){ done[it.k] = 1; store.set('tr:faceDone', done); el.classList.add('done'); }
    if(a === 'reset'){ delete overrides[it.k]; store.set('tr:faceOverrides', overrides); }
    if(a === 'est'){ const f = it.f.slice(); const fig = f[4] - f[3]; f[2] = +(fig / 7.2).toFixed(4); f[1] = +(f[3] + 0.75 * f[2]).toFixed(4); f[5] = 2; overrides[it.k] = f; store.set('tr:faceOverrides', overrides); }
    draw(); stat();
  });
  return el;
}
$('#filter').addEventListener('change', () => render(true));
$('#more').addEventListener('click', () => render(false));
$('#export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(overrides, null, 0)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'faces_overrides.json'; a.click();
});
$('#clear').addEventListener('click', () => { if(confirm('手直しをすべて消しますか？')){ overrides = {}; store.set('tr:faceOverrides', overrides); render(true); } });
</script>
</body>
</html>
