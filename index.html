<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terra Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Serif+JP:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===== 目次 ===== -->
<main id="toc" class="toc" hidden>
  <header class="tocTop">
    <div>
      <h1>Terra Reader</h1>
      <div class="sub mono" id="tocSub">ja_JP</div>
    </div>
    <button class="ib" id="btnSettings" title="設定" aria-label="設定">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
    </button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="main" class="on">メイン</button>
    <button data-tab="event">イベント</button>
    <button data-tab="record">オペレーター記録</button>
  </nav>
  <input class="search" id="search" type="search" placeholder="タイトル・話番号で絞り込み" autocomplete="off">
  <div id="groups" class="groups"></div>
</main>

<!-- ===== プレイヤー ===== -->
<div id="stage" class="stage" hidden aria-label="シナリオプレイヤー">
  <div class="visual" id="visual">
    <div class="layer bg"><img id="bgA" alt=""><img id="bgB" alt=""></div>
    <div class="layer"><img id="spL" class="sp" alt=""><img id="spM" class="sp" alt=""><img id="spR" class="sp" alt=""></div>
    <div class="layer still" id="still"><img id="stillImg" alt=""></div>
    <div class="layer vig"></div>
    <button class="peekBtn" id="btnPeek" title="絵を全画面で見る" aria-label="絵を全画面で見る">
      <svg class="ic-expand" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg>
      <svg class="ic-collapse" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5H3M12 8h5V3M17 12h-5v5M3 12h5v5"/></svg>
    </button>
  </div>

  <div class="top">
    <button class="b" id="btnBack" title="目次へ">‹ 目次</button>
    <span class="code" id="code"></span>
    <span class="bgm" id="bgm" hidden>♪</span>
    <span class="grow"></span>
    <button class="b" id="btnAuto" title="自動で進める">AUTO</button>
  </div>

  <div class="panel" id="panel">
    <div class="feed" id="feed"><div class="spacer"></div></div>
    <span class="cur" id="cur">▼</span>
    <div class="loading" id="loading" hidden><span></span>読み込み中</div>
  </div>
  <div class="seek" aria-hidden="true"><div class="rail" id="rail"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
</div>

<!-- ===== 設定 ===== -->
<div id="settings" class="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label>ドクターの名前<input id="setDoc" type="text" maxlength="12" autocomplete="off"></label>
    <label>文字サイズ
      <div class="seg" id="setFont"><button data-v="15">小</button><button data-v="16">中</button><button data-v="18">大</button></div>
    </label>
    <label class="row"><input id="setProxy" type="checkbox"> 画像を縮小して読み込む（通信量を抑える）</label>
    <label class="row"><input id="setSys" type="checkbox"> チュートリアル文も表示する</label>
    <label class="row"><input id="setFaces" type="checkbox"> 立ち絵を顔の大きさで揃える（オフ＝元の絵のまま）</label>
    <div class="sheetBtns">
      <button class="danger" id="btnResetProgress">既読をすべて消す</button>
      <button class="primary" id="btnCloseSettings">閉じる</button>
    </div>
    <p class="fine">本文・画像は GitHub 上の公開データ（ArknightsAssets）から読むたびに取得します。端末に保存されるのは既読位置と設定だけです。</p>
  </div>
</div>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
